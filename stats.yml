name: Update git stats

on:
  schedule:
    - cron: '0 3 * * *'     # every day at 03:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # allows the action to commit data.json back to the repo

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stats (public + private)
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}     # your GitHub Personal Access Token (repo secret)
          GH_LOGIN: ${{ github.repository_owner }}    # your GitHub username, filled automatically
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}   # optional: GitLab token (scope read_api); merge skipped if unset
        run: node fetch-stats.js

      - name: Commit data.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          git diff --quiet --cached || git commit -m "chore: update git stats"
          git push
